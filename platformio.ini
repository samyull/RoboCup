[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps = 
	adafruit/Adafruit TCS34725@^1.4.4
	arkhipenko/TaskScheduler@^3.7.0
	adafruit/Adafruit BNO055@^1.6.3
	bitcraze/Bitcraze PMW3901@^1.2
	fastled/FastLED@^3.10.5
